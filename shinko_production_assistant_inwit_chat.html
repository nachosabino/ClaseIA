<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shinko Chat - INWIT AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        inwit: {
                            950: '#030712',
                            900: '#050a18',
                            800: '#0b132b',
                            gold: '#ffb703',
                            amber: '#fb8500',
                            cyan: '#70d6ff'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(112, 214, 255, 0.12);
        }

        .glass-btn {
            background: rgba(11, 25, 50, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(112, 214, 255, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-btn:hover {
            background: rgba(112, 214, 255, 0.15);
            border-color: rgba(112, 214, 255, 0.6);
            box-shadow: 0 0 15px rgba(112, 214, 255, 0.3);
        }

        .gold-badge {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 183, 3, 0.4);
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.15);
        }

        .gold-title {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 183, 3, 0.6), 0 0 40px rgba(251, 133, 0, 0.4);
        }

        .glass-input-container {
            background: rgba(6, 12, 28, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 183, 3, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 183, 3, 0.03);
            transition: all 0.3s ease;
        }

        .glass-input-container:focus-within {
            border-color: rgba(255, 183, 3, 0.7);
            box-shadow: 0 12px 45px rgba(255, 183, 3, 0.25), inset 0 0 25px rgba(255, 183, 3, 0.08);
        }

        .chip-option {
            background: rgba(8, 16, 36, 0.8);
            border: 1px solid rgba(112, 214, 255, 0.2);
            transition: all 0.3s ease;
        }

        .chip-option:hover {
            background: rgba(255, 183, 3, 0.15);
            border-color: rgba(255, 183, 3, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 183, 3, 0.25);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 183, 3, 0.3);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-inwit-950 text-white font-sans h-full flex flex-col overflow-hidden selection:bg-amber-500 selection:text-black">

    <!-- CANVAS CON BLOQUES TETRIS REORGANIZABLES EN TIEMPO REAL -->
    <canvas id="gridBlockCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none opacity-40"></canvas>

    <!-- HEADER IDÉNTICO A LA CAPTURA -->
    <header class="relative z-20 glass-header px-4 sm:px-8 py-3 flex items-center justify-between">
        
        <!-- Izquierda: Volver a INWIT + Shinko Profile -->
        <div class="flex items-center space-x-4">
            <a href="index.html" class="px-4 py-1.5 rounded-xl glass-btn text-cyan-300 font-mono text-xs flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Volver a INWIT</span>
            </a>

            <div class="flex items-center space-x-3">
                <!-- Ícono Ábaco Dorado Shinko -->
                <div class="w-9 h-9 rounded-xl bg-amber-500/20 border border-amber-400/50 p-1.5 flex items-center justify-center text-amber-400 shadow-[0_0_15px_rgba(255,183,3,0.3)]">
                    <svg viewBox="0 0 100 100" class="w-full h-full fill-none stroke-current" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="15" y="15" width="70" height="70" rx="12" stroke-width="6"/>
                        <line x1="20" y1="35" x2="80" y2="35"/>
                        <line x1="20" y1="50" x2="80" y2="50"/>
                        <line x1="20" y1="65" x2="80" y2="65"/>
                        <rect x="30" y="29" width="12" height="12" rx="3" fill="currentColor"/>
                        <rect x="58" y="29" width="12" height="12" rx="3" fill="currentColor"/>
                        <rect x="42" y="44" width="12" height="12" rx="3" fill="currentColor"/>
                        <rect x="30" y="59" width="12" height="12" rx="3" fill="currentColor"/>
                        <path d="M60 72 L75 58 M75 58 L67 58 M75 58 L75 66" stroke="#ffffff" stroke-width="6"/>
                    </svg>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-orbitron font-bold text-sm text-white">Shinko</span>
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    </div>
                    <span class="text-[11px] font-mono text-amber-300/80">Asistente de Producción & Analítica</span>
                </div>
            </div>
        </div>

        <!-- Derecha: Historial -->
        <div class="flex items-center">
            <button id="sidebarToggle" class="px-4 py-1.5 rounded-xl glass-btn text-xs text-blue-100 font-mono flex items-center space-x-2">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Historial</span>
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
    <div class="relative z-10 flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR DE HISTORIAL -->
        <aside id="sidebar" class="w-72 bg-inwit-900/95 border-r border-amber-500/20 p-4 flex flex-col justify-between transition-all duration-300 transform -translate-x-full absolute inset-y-0 left-0 z-30 md:relative md:translate-x-0 hidden">
            <div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-xs font-orbitron text-amber-400 tracking-wider">CONVERSACIONES</span>
                    <button onclick="resetChat()" class="text-xs text-amber-300 hover:text-white p-1">
                        <i class="fa-solid fa-plus-circle text-base"></i>
                    </button>
                </div>
                <div class="space-y-2 text-xs">
                    <button class="w-full text-left px-3 py-2.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-200 truncate flex items-center space-x-2">
                        <i class="fa-regular fa-message text-amber-400"></i>
                        <span>Eficiencia Planta Ensamblaje #4</span>
                    </button>
                    <button class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-blue-200/70 hover:text-white truncate flex items-center space-x-2 transition-colors">
                        <i class="fa-regular fa-message opacity-50"></i>
                        <span>Predicción Falla Prensa Hidráulica</span>
                    </button>
                    <button class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-blue-200/70 hover:text-white truncate flex items-center space-x-2 transition-colors">
                        <i class="fa-regular fa-message opacity-50"></i>
                        <span>Reporte OEE Turno Mañana</span>
                    </button>
                </div>
            </div>
            <div class="pt-4 border-t border-white/10 text-[11px] text-blue-200/50 font-mono">
                INWIT OS • Shinko Engine v2.4
            </div>
        </aside>

        <!-- ZONA DE CHAT CENTRAL -->
        <main class="flex-1 flex flex-col justify-between p-4 sm:p-6 overflow-y-auto relative">
            
            <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center">

                <!-- 1. PANTALLA HERO DE BIENVENIDA (FOTO REPRODUCIDA EXACTAMENTE) -->
                <div id="welcomeScreen" class="flex flex-col items-center text-center space-y-6 py-6 my-auto transition-all duration-500">
                    
                    <!-- Pill Badge -->
                    <div class="gold-badge px-5 py-1.5 rounded-full text-amber-300 text-xs font-mono tracking-wider">
                        Shinko v2.4 • Analítica IoT & Manufactura
                    </div>

                    <!-- Título Principal -->
                    <h1 class="font-orbitron text-4xl sm:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-100 to-amber-500 tracking-wide gold-title">
                        Hola, soy Shinko de INWIT
                    </h1>

                    <!-- Subtítulo -->
                    <p class="text-base sm:text-xl text-blue-200/80 font-light max-w-2xl">
                        Tu asistente de producción, ¿en qué te puedo ayudar?
                    </p>

                </div>

                <!-- 2. LÍNEA DE TIEMPO DE MENSAJES (Muestra tras interactuar) -->
                <div id="chatTimeline" class="hidden space-y-6 py-6 w-full max-w-3xl mx-auto"></div>

            </div>

            <!-- CONTENEDOR INFERIOR DE ACCIONES E INPUT (EXACTO A LA IMAGEN) -->
            <div class="w-full max-w-3xl mx-auto space-y-4 pt-2 sticky bottom-0 z-20">
                
                <!-- Chips de Sugerencia -->
                <div id="suggestionChips" class="flex items-center justify-start sm:justify-center space-x-2 overflow-x-auto pb-1 no-scrollbar px-1">
                    <button onclick="sendQuickPrompt('📊 Analizar la eficiencia OEE de la línea de producción')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-blue-100 whitespace-nowrap flex items-center space-x-2">
                        <span>📊 Analizar eficiencia de línea</span>
                    </button>
                    <button onclick="sendQuickPrompt('⚙️ Diagnosticar alertas de mantenimiento predictivo')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-blue-100 whitespace-nowrap flex items-center space-x-2">
                        <span>⚙️ Predecir mantenimiento</span>
                    </button>
                    <button onclick="sendQuickPrompt('🏭 Optimizar inventario de materia prima e insumos')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-blue-100 whitespace-nowrap flex items-center space-x-2">
                        <span>🏭 Optimizar inventario COGS</span>
                    </button>
                    <button onclick="sendQuickPrompt('📈 Generar resumen de rendimiento del turno actual')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-blue-100 whitespace-nowrap flex items-center space-x-2">
                        <span>📈 Reporte de manufactura</span>
                    </button>
                </div>

                <!-- Contenedor del Input de Texto -->
                <div class="glass-input-container rounded-2xl p-3 sm:p-4 flex flex-col space-y-3">
                    
                    <textarea id="chatInput" rows="2" placeholder="Escribe tu consulta sobre datos, producción o automatización..." class="w-full bg-transparent text-white placeholder-blue-200/40 text-sm focus:outline-none resize-none px-2"></textarea>

                    <!-- Fila de Controles Inferiores -->
                    <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        
                        <div class="flex items-center space-x-3">
                            <button class="text-blue-300/80 hover:text-white transition-colors text-sm px-1" title="Adjuntar datos">
                                <i class="fa-solid fa-plus"></i>
                            </button>

                            <select class="bg-inwit-900/90 text-blue-200 text-xs font-mono border border-blue-500/30 rounded-lg px-3 py-1 focus:outline-none cursor-pointer">
                                <option>Modo Diagnóstico</option>
                                <option>Modo Predicción IoT</option>
                                <option>Modo Reporte Ejecutivo</option>
                            </select>
                        </div>

                        <div class="flex items-center space-x-3">
                            <button class="text-blue-300/80 hover:text-white transition-colors text-sm" title="Micrófono">
                                <i class="fa-solid fa-microphone"></i>
                            </button>

                            <button id="sendBtn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-black font-orbitron font-bold text-xs tracking-wider flex items-center space-x-2 shadow-[0_0_20px_rgba(255,183,3,0.4)] transition-all">
                                <span>Enviar</span>
                                <i class="fa-solid fa-paper-plane text-xs"></i>
                            </button>
                        </div>

                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- JAVASCRIPT: ANIMACIÓN CANVAS DE BLOQUES TETRIS REORGANIZABLES -->
    <script>
        // --- 1. CANVAS DE BLOQUES Y CAJAS ACOPLABLES (TETRIS INDUSTRIAL) ---
        const canvas = document.getElementById('gridBlockCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const gridSize = 40; // Tamaño del módulo de grilla
        let blocks = [];

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            createBlocks();
        });

        class GridBlock {
            constructor() {
                this.reset();
            }

            reset() {
                this.cols = Math.floor(Math.random() * 3) + 1; // ancho de bloque (1-3 celdas)
                this.rows = Math.floor(Math.random() * 2) + 1; // alto de bloque (1-2 celdas)
                
                // Alineación perfecta en grilla
                this.targetGridX = Math.floor(Math.random() * (width / gridSize));
                this.targetGridY = Math.floor(Math.random() * (height / gridSize));
                
                this.x = this.targetGridX * gridSize;
                this.y = (this.targetGridY - 5) * gridSize; // empieza arriba fuera de pantalla o desplazado
                this.targetY = this.targetGridY * gridSize;

                this.color = ['rgba(255, 183, 3, ', 'rgba(112, 214, 255, ', 'rgba(15, 23, 42, '][Math.floor(Math.random() * 3)];
                this.alpha = 0;
                this.maxAlpha = Math.random() * 0.35 + 0.1;
                this.speed = Math.random() * 1.5 + 0.8;
                this.state = 'spawning'; // spawning -> locked -> fading
                this.lockTimer = 0;
            }

            update() {
                if (this.state === 'spawning') {
                    this.y += (this.targetY - this.y) * 0.05;
                    this.alpha += 0.01;
                    if (Math.abs(this.targetY - this.y) < 1) {
                        this.y = this.targetY;
                        this.state = 'locked';
                        this.lockTimer = Math.random() * 180 + 120; // 2 a 5 segundos bloqueado
                    }
                } else if (this.state === 'locked') {
                    this.lockTimer--;
                    if (this.lockTimer <= 0) {
                        this.state = 'fading';
                    }
                } else if (this.state === 'fading') {
                    this.alpha -= 0.008;
                    if (this.alpha <= 0) {
                        this.reset();
                    }
                }
            }

            draw() {
                const w = this.cols * gridSize - 2;
                const h = this.rows * gridSize - 2;

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                // Relleno de caja
                ctx.fillStyle = this.color + '0.15)';
                ctx.fillRect(this.x, this.y, w, h);

                // Borde neón industrial
                ctx.strokeStyle = this.color + '0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(this.x, this.y, w, h);

                // Nodos en esquinas (Sensación de automatización / Tetris)
                ctx.fillStyle = this.color + '0.8)';
                ctx.fillRect(this.x, this.y, 3, 3);
                ctx.fillRect(this.x + w - 3, this.y, 3, 3);
                ctx.fillRect(this.x, this.y + h - 3, 3, 3);
                ctx.fillRect(this.x + w - 3, this.y + h - 3, 3, 3);

                ctx.restore();
            }
        }

        function createBlocks() {
            blocks = [];
            const count = Math.floor((width * height) / 35000);
            for (let i = 0; i < count; i++) {
                blocks.push(new GridBlock());
            }
        }
        createBlocks();

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            // Dibujar cuadrícula tenue de fondo
            ctx.strokeStyle = 'rgba(112, 214, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Animar bloques
            blocks.forEach(b => {
                b.update();
                b.draw();
            });

            requestAnimationFrame(animateCanvas);
        }
        animateCanvas();

        // --- 2. LÓGICA DE CHAT INTERACTIVO ---
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatTimeline = document.getElementById('chatTimeline');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const suggestionChips = document.getElementById('suggestionChips');

        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
        });

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Transición: Ocultar bienvenida y revelar chat
            if (!welcomeScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatTimeline.classList.remove('hidden');
                suggestionChips.classList.add('opacity-40');
            }

            appendUserMessage(text);
            chatInput.value = '';

            setTimeout(() => {
                generateShinkoResponse(text);
            }, 700);
        }

        function sendQuickPrompt(promptText) {
            chatInput.value = promptText;
            handleSend();
        }

        function appendUserMessage(text) {
            const msgHtml = `
                <div class="flex items-start justify-end space-x-3">
                    <div class="glass-input-container rounded-2xl rounded-tr-none p-4 max-w-xl text-sm text-blue-100">
                        ${escapeHtml(text)}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-400/50 flex items-center justify-center text-xs font-bold text-amber-300">
                        TÚ
                    </div>
                </div>
            `;
            chatTimeline.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function generateShinkoResponse(userQuery) {
            let responseText = "";
            const queryLower = userQuery.toLowerCase();

            if (queryLower.includes("eficiencia") || queryLower.includes("oee")) {
                responseText = `
                    <p class="mb-2"><strong>Análisis OEE de Línea de Producción #4:</strong></p>
                    <ul class="list-disc list-inside space-y-1 text-xs opacity-90 mb-3">
                        <li><strong>Disponibilidad:</strong> 96.2%</li>
                        <li><strong>Rendimiento:</strong> 91.8%</li>
                        <li><strong>Calidad:</strong> 99.1%</li>
                    </ul>
                    <div class="p-3 bg-amber-950/40 border border-amber-500/40 rounded-xl text-xs text-amber-200">
                        ⚡ <strong>Diagnóstico Shinko:</strong> Celda de estampado optimizada. Rendimiento +4.2% respecto al turno anterior.
                    </div>
                `;
            } else {
                responseText = `
                    <p class="mb-2">Procesando consulta en **INWIT OS (Shinko Engine v2.4)**...</p>
                    <p class="text-xs leading-relaxed opacity-90">
                        Métricas de planta consolidadas. Todos los parámetros de automatización se mantienen en niveles óptimos sin anomalías térmicas ni micro-paradas registradas.
                    </p>
                `;
            }

            const botHtml = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-amber-500/20 border border-amber-400/50 p-1.5 flex items-center justify-center text-amber-400 text-xs shrink-0">
                        <i class="fa-solid fa-chart-network"></i>
                    </div>
                    <div class="glass-input-container rounded-2xl rounded-tl-none p-4 max-w-xl text-sm text-blue-100">
                        <div class="text-[11px] font-mono text-amber-400 mb-1 font-semibold">Shinko AI</div>
                        ${responseText}
                    </div>
                </div>
            `;
            chatTimeline.insertAdjacentHTML('beforeend', botHtml);
            scrollToBottom();
        }

        function scrollToBottom() {
            const mainContent = document.querySelector('main');
            mainContent.scrollTop = mainContent.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
