<!DOCTYPE html>
<html lang="es" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petra Chat - INWIT AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Orbitron:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif'],
                    },
                    colors: {
                        inwit: {
                            950: '#030712',
                            900: '#070518',
                            800: '#120b2b',
                            purple: '#c084fc',
                            magenta: '#e879f9',
                            cyan: '#70d6ff'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .glass-header {
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(192, 132, 252, 0.2);
        }

        .glass-btn {
            background: rgba(20, 11, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(192, 132, 252, 0.25);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-btn:hover {
            background: rgba(192, 132, 252, 0.2);
            border-color: rgba(192, 132, 252, 0.6);
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.35);
        }

        .purple-badge {
            background: rgba(23, 15, 42, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.4);
            box-shadow: 0 0 18px rgba(192, 132, 252, 0.2);
        }

        .purple-title {
            color: #ffffff;
            text-shadow: 0 0 25px rgba(192, 132, 252, 0.7), 0 0 50px rgba(232, 121, 249, 0.5);
        }

        .glass-input-container {
            background: rgba(10, 6, 28, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(192, 132, 252, 0.35);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(192, 132, 252, 0.05);
            transition: all 0.3s ease;
        }

        .glass-input-container:focus-within {
            border-color: rgba(192, 132, 252, 0.8);
            box-shadow: 0 12px 45px rgba(192, 132, 252, 0.3), inset 0 0 25px rgba(192, 132, 252, 0.1);
        }

        .chip-option {
            background: rgba(16, 8, 36, 0.85);
            border: 1px solid rgba(192, 132, 252, 0.25);
            transition: all 0.3s ease;
        }

        .chip-option:hover {
            background: rgba(192, 132, 252, 0.2);
            border-color: rgba(192, 132, 252, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 4px 18px rgba(192, 132, 252, 0.3);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(192, 132, 252, 0.4);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-inwit-950 text-white font-sans h-full flex flex-col overflow-hidden selection:bg-purple-500 selection:text-white">

    <!-- CANVAS ANIMADO: EFECTO NOCHE ESTRELLADA DE VAN GOGH (BRUSHSTROKES Y ESPIRALES FLUIDAS EN BUCLE) -->
    <canvas id="vanGoghCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none opacity-50"></canvas>

    <!-- HEADER DE PETRA IDÉNTICO AL SISTEMA INWIT -->
    <header class="relative z-20 glass-header px-4 sm:px-8 py-3 flex items-center justify-between">
        
        <!-- Izquierda: Volver a INWIT + Perfil de Petra -->
        <div class="flex items-center space-x-4">
            <a href="index.html" class="px-4 py-1.5 rounded-xl glass-btn text-purple-300 font-mono text-xs flex items-center space-x-2">
                <i class="fa-solid fa-arrow-left text-xs"></i>
                <span>Volver a INWIT</span>
            </a>

            <div class="flex items-center space-x-3">
                <!-- Ícono Varita Mágica de Petra -->
                <div class="w-9 h-9 rounded-xl bg-purple-500/20 border border-purple-400/50 p-1.5 flex items-center justify-center text-purple-300 shadow-[0_0_15px_rgba(192,132,252,0.4)]">
                    <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <span class="font-orbitron font-bold text-sm text-white">Petra</span>
                        <span class="w-2 h-2 rounded-full bg-purple-400 animate-pulse"></span>
                    </div>
                    <span class="text-[11px] font-mono text-purple-300/80">Asistente de Diseño Audiovisual & Creativo</span>
                </div>
            </div>
        </div>

        <!-- Derecha: Historial -->
        <div class="flex items-center">
            <button id="sidebarToggle" class="px-4 py-1.5 rounded-xl glass-btn text-xs text-purple-100 font-mono flex items-center space-x-2">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Historial</span>
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DEL CHAT -->
    <div class="relative z-10 flex-1 flex overflow-hidden">
        
        <!-- SIDEBAR DE HISTORIAL -->
        <aside id="sidebar" class="w-72 bg-inwit-900/95 border-r border-purple-500/20 p-4 flex flex-col justify-between transition-all duration-300 transform -translate-x-full absolute inset-y-0 left-0 z-30 md:relative md:translate-x-0 hidden">
            <div>
                <div class="flex items-center justify-between mb-6">
                    <span class="text-xs font-orbitron text-purple-400 tracking-wider">GALERÍA & PROYECTOS</span>
                    <button onclick="resetChat()" class="text-xs text-purple-300 hover:text-white p-1">
                        <i class="fa-solid fa-plus-circle text-base"></i>
                    </button>
                </div>
                <div class="space-y-2 text-xs">
                    <button class="w-full text-left px-3 py-2.5 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-200 truncate flex items-center space-x-2">
                        <i class="fa-solid fa-palette text-purple-400"></i>
                        <span>Campaña Neón Cyberpunk 4K</span>
                    </button>
                    <button class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-purple-200/70 hover:text-white truncate flex items-center space-x-2 transition-colors">
                        <i class="fa-regular fa-image opacity-50"></i>
                        <span>Storyboard Lanzamiento Producto</span>
                    </button>
                    <button class="w-full text-left px-3 py-2.5 rounded-xl hover:bg-white/5 text-purple-200/70 hover:text-white truncate flex items-center space-x-2 transition-colors">
                        <i class="fa-regular fa-film opacity-50"></i>
                        <span>Render 3D Packaging Industrial</span>
                    </button>
                </div>
            </div>
            <div class="pt-4 border-t border-white/10 text-[11px] text-purple-200/50 font-mono">
                INWIT OS • Petra Studio Engine v3.1
            </div>
        </aside>

        <!-- ZONA DE CHAT CENTRAL -->
        <main class="flex-1 flex flex-col justify-between p-4 sm:p-6 overflow-y-auto relative">
            
            <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col justify-center">

                <!-- 1. PANTALLA HERO DE BIENVENIDA (ESTILO PETRA TALLER ARTÍSTICO) -->
                <div id="welcomeScreen" class="flex flex-col items-center text-center space-y-6 py-6 my-auto transition-all duration-500">
                    
                    <!-- Pill Badge -->
                    <div class="purple-badge px-5 py-1.5 rounded-full text-purple-300 text-xs font-mono tracking-wider">
                        Petra v3.1 • Generativo 4K & Dirección Creativa
                    </div>

                    <!-- Título Principal -->
                    <h1 class="font-orbitron text-3xl sm:text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-300 via-white to-magenta-400 tracking-wide purple-title leading-tight">
                        ¡Soy Petra, bienvenido a mi taller artístico!
                    </h1>

                    <!-- Subtítulo -->
                    <p class="text-base sm:text-xl text-purple-100/80 font-light max-w-2xl">
                        ¿Qué idea llevaremos a cabo hoy?
                    </p>

                </div>

                <!-- 2. LÍNEA DE TIEMPO DE MENSAJES DE PETRA -->
                <div id="chatTimeline" class="hidden space-y-6 py-6 w-full max-w-3xl mx-auto"></div>

            </div>

            <!-- CONTENEDOR INFERIOR DE ACCIONES E INPUT -->
            <div class="w-full max-w-3xl mx-auto space-y-4 pt-2 sticky bottom-0 z-20">
                
                <!-- Chips de Sugerencia -->
                <div id="suggestionChips" class="flex items-center justify-start sm:justify-center space-x-2 overflow-x-auto pb-1 no-scrollbar px-1">
                    <button onclick="sendQuickPrompt('🎨 Generar campaña publicitaria multimedia')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-purple-100 whitespace-nowrap flex items-center space-x-2">
                        <span>🎨 Generar campaña publicitaria</span>
                    </button>
                    <button onclick="sendQuickPrompt('🎬 Crear Storyboard publicitario para video')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-purple-100 whitespace-nowrap flex items-center space-x-2">
                        <span>🎬 Crear Storyboard publicitario</span>
                    </button>
                    <button onclick="sendQuickPrompt('✦ Branding & Identidad de marca visual')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-purple-100 whitespace-nowrap flex items-center space-x-2">
                        <span>✦ Branding & Identidad de marca</span>
                    </button>
                    <button onclick="sendQuickPrompt('🖼️ Renderizar producto en 3D/4K ultra realista')" class="chip-option px-4 py-2 rounded-xl text-xs font-medium text-purple-100 whitespace-nowrap flex items-center space-x-2">
                        <span>🖼️ Renderizar producto en 3D/4K</span>
                    </button>
                </div>

                <!-- Contenedor del Input de Texto -->
                <div class="glass-input-container rounded-2xl p-3 sm:p-4 flex flex-col space-y-3">
                    
                    <textarea id="chatInput" rows="2" placeholder="Describe el concepto visual, paleta de colores o render que deseas crear..." class="w-full bg-transparent text-white placeholder-purple-200/40 text-sm focus:outline-none resize-none px-2"></textarea>

                    <!-- Fila de Controles Inferiores -->
                    <div class="flex items-center justify-between pt-2 border-t border-white/10">
                        
                        <div class="flex items-center space-x-3">
                            <button class="text-purple-300/80 hover:text-white transition-colors text-sm px-1" title="Adjuntar imagen / boceto">
                                <i class="fa-solid fa-paperclip"></i>
                            </button>

                            <select class="bg-inwit-900/90 text-purple-200 text-xs font-mono border border-purple-500/30 rounded-lg px-3 py-1 focus:outline-none cursor-pointer">
                                <option>Modo Creativo HD</option>
                                <option>Modo Publicidad 4K</option>
                                <option>Modo UI/UX Concept</option>
                                <option>Modo Arte Óleo / Van Gogh</option>
                            </select>
                        </div>

                        <div class="flex items-center space-x-3">
                            <button class="text-purple-300/80 hover:text-white transition-colors text-sm" title="Micrófono">
                                <i class="fa-solid fa-microphone"></i>
                            </button>

                            <button id="sendBtn" class="px-5 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-400 hover:to-pink-400 text-white font-orbitron font-bold text-xs tracking-wider flex items-center space-x-2 shadow-[0_0_20px_rgba(192,132,252,0.4)] transition-all">
                                <span>Enviar</span>
                                <i class="fa-solid fa-palette text-xs"></i>
                            </button>
                        </div>

                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- JAVASCRIPT: ANIMACIÓN VAN GOGH EN CANVAS EN BUCLE + CHAT LOGIC -->
    <script>
        // --- 1. CANVAS EN BUCLE: FLUIDEZ DE "LA NOCHE ESTRELLADA" (VAN GOGH INSPIRADO) ---
        const canvas = document.getElementById('vanGoghCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initVanGogh();
        });

        // Partículas en espiral e impulsos de pincelada
        let swirls = [];
        let stars = [];
        let time = 0;

        class VanGoghStar {
            constructor(x, y, radius) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 0.015 + 0.005;
                this.color = ['#fde047', '#fbbf24', '#c084fc', '#a855f7', '#70d6ff'][Math.floor(Math.random() * 5)];
            }
            draw() {
                this.angle += this.speed;
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Anillos de luz concéntricos estilo pincelada Van Gogh
                for (let r = this.radius; r > 5; r -= 6) {
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 1.6);
                    ctx.strokeStyle = this.color;
                    ctx.globalAlpha = (1 - r / (this.radius + 10)) * 0.4;
                    ctx.lineWidth = 2.5;
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                }

                // Núcleo brillante de estrella
                ctx.beginPath();
                ctx.arc(0, 0, 4, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.globalAlpha = 0.8;
                ctx.fill();

                ctx.restore();
            }
        }

        class BrushStroke {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.length = Math.random() * 40 + 20;
                this.angle = Math.random() * Math.PI * 2;
                this.angularVelocity = (Math.random() - 0.5) * 0.02;
                this.speed = Math.random() * 0.8 + 0.3;
                this.color = ['#3b0764', '#581c87', '#6b21a8', '#1e1b4b', '#1e3a8a', '#fbbf24'][Math.floor(Math.random() * 6)];
                this.alpha = 0;
                this.maxAlpha = Math.random() * 0.35 + 0.1;
                this.life = 0;
                this.maxLife = Math.random() * 250 + 150;
            }
            update() {
                this.life++;
                this.angle += Math.sin(time * 0.002 + this.x * 0.005) * 0.03 + this.angularVelocity;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.life < 40) {
                    this.alpha = (this.life / 40) * this.maxAlpha;
                } else if (this.life > this.maxLife - 40) {
                    this.alpha = ((this.maxLife - this.life) / 40) * this.maxAlpha;
                }

                if (this.life >= this.maxLife || this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                const endX = this.x + Math.cos(this.angle) * this.length;
                const endY = this.y + Math.sin(this.angle) * this.length;
                
                // Curva de pincel suave
                const cpX = (this.x + endX) / 2 + Math.sin(this.angle) * 12;
                const cpY = (this.y + endY) / 2 + Math.cos(this.angle) * 12;

                ctx.quadraticCurveTo(cpX, cpY, endX, endY);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.stroke();
                ctx.restore();
            }
        }

        function initVanGogh() {
            swirls = [];
            stars = [];
            
            // Crear 5 estrellas giratorias estilo Noche Estrellada
            stars.push(new VanGoghStar(width * 0.2, height * 0.25, 45));
            stars.push(new VanGoghStar(width * 0.8, height * 0.2, 55));
            stars.push(new VanGoghStar(width * 0.5, height * 0.45, 35));
            stars.push(new VanGoghStar(width * 0.85, height * 0.7, 40));
            stars.push(new VanGoghStar(width * 0.15, height * 0.75, 50));

            // Crear 90 pinceladas fluidas
            for (let i = 0; i < 90; i++) {
                swirls.push(new BrushStroke());
            }
        }
        initVanGogh();

        function animateVanGogh() {
            time++;
            ctx.fillStyle = 'rgba(3, 7, 18, 0.25)'; // Rastro continuo suave
            ctx.fillRect(0, 0, width, height);

            // Animar pinceladas estilo óleo
            swirls.forEach(s => {
                s.update();
                s.draw();
            });

            // Animar estrellas en espiral
            stars.forEach(st => st.draw());

            requestAnimationFrame(animateVanGogh);
        }
        animateVanGogh();

        // --- 2. LÓGICA DEL CHAT Y INTERACCIÓN CREATIVA DE PETRA ---
        const welcomeScreen = document.getElementById('welcomeScreen');
        const chatTimeline = document.getElementById('chatTimeline');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const suggestionChips = document.getElementById('suggestionChips');

        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
        });

        function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Ocultar pantalla de bienvenida y desplegar la conversación activa
            if (!welcomeScreen.classList.contains('hidden')) {
                welcomeScreen.classList.add('hidden');
                chatTimeline.classList.remove('hidden');
                suggestionChips.classList.add('opacity-40');
            }

            appendUserMessage(text);
            chatInput.value = '';

            setTimeout(() => {
                generatePetraResponse(text);
            }, 800);
        }

        function sendQuickPrompt(promptText) {
            chatInput.value = promptText;
            handleSend();
        }

        function appendUserMessage(text) {
            const msgHtml = `
                <div class="flex items-start justify-end space-x-3">
                    <div class="glass-input-container rounded-2xl rounded-tr-none p-4 max-w-xl text-sm text-purple-100">
                        ${escapeHtml(text)}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-purple-500/20 border border-purple-400/50 flex items-center justify-center text-xs font-bold text-purple-300">
                        TÚ
                    </div>
                </div>
            `;
            chatTimeline.insertAdjacentHTML('beforeend', msgHtml);
            scrollToBottom();
        }

        function generatePetraResponse(userQuery) {
            let responseText = "";
            const queryLower = userQuery.toLowerCase();

            if (queryLower.includes("campaña") || queryLower.includes("publicidad") || queryLower.includes("branding")) {
                responseText = `
                    <p class="mb-2"><strong>✨ Propuesta de Dirección Creativa & Campaña:</strong></p>
                    <p class="text-xs leading-relaxed opacity-90 mb-3">
                        He sintetizado una paleta neón cyberpunk con estética futurista de alta conversión para tu marca:
                    </p>
                    <div class="grid grid-cols-4 gap-2 mb-3">
                        <div class="h-8 rounded-lg bg-purple-600 flex items-center justify-center text-[10px] font-mono text-white">#9333EA</div>
                        <div class="h-8 rounded-lg bg-fuchsia-500 flex items-center justify-center text-[10px] font-mono text-white">#D946EF</div>
                        <div class="h-8 rounded-lg bg-cyan-400 flex items-center justify-center text-[10px] font-mono text-black">#22D3EE</div>
                        <div class="h-8 rounded-lg bg-amber-400 flex items-center justify-center text-[10px] font-mono text-black">#FBBF24</div>
                    </div>
                    <div class="p-3 bg-purple-950/50 border border-purple-500/40 rounded-xl text-xs text-purple-200">
                        🎨 <strong>Render Generado 4K:</strong> Piezas publicitarias adaptadas a formatos 16:9, 9:16 y 1:1 listas para exportación.
                    </div>
                `;
            } else {
                responseText = `
                    <p class="mb-2">Creando concepto visual en **Petra Studio v3.1**...</p>
                    <div class="aspect-video bg-gradient-to-tr from-purple-900/60 via-slate-900 to-fuchsia-950 rounded-xl border border-purple-500/30 flex flex-col items-center justify-center p-4 text-center my-2 relative overflow-hidden">
                        <i class="fa-solid fa-wand-magic-sparkles text-3xl text-purple-400 mb-2 animate-pulse"></i>
                        <span class="text-xs font-orbitron text-white">Concepto Visual Renderizado 4K</span>
                        <span class="text-[10px] text-purple-300/70 font-mono mt-1">Estilo: Noche Estrellada / Neón Futurista</span>
                    </div>
                    <p class="text-xs leading-relaxed opacity-90">
                        Concepto completado. ¿Te gustaría ajustar el estilo cromático, la iluminación volumétrica o generar variaciones?
                    </p>
                `;
            }

            const botHtml = `
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 rounded-xl bg-purple-500/20 border border-purple-400/50 p-1.5 flex items-center justify-center text-purple-300 text-xs shrink-0">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </div>
                    <div class="glass-input-container rounded-2xl rounded-tl-none p-4 max-w-xl text-sm text-purple-100">
                        <div class="text-[11px] font-mono text-purple-400 mb-1 font-semibold">Petra AI</div>
                        ${responseText}
                    </div>
                </div>
            `;
            chatTimeline.insertAdjacentHTML('beforeend', botHtml);
            scrollToBottom();
        }

        function scrollToBottom() {
            const mainContent = document.querySelector('main');
            mainContent.scrollTop = mainContent.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        sendBtn.addEventListener('click', handleSend);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    </script>
</body>
</html>
